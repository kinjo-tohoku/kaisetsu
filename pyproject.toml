[project]
name = "kaisetsu"
version = "0.1.14"
description = "初心者向け・日本語対応の粉末回折解析プログラム(Rietveld / PDF / MEM)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Katsuki Kinjo" }]
keywords = ["rietveld", "powder diffraction", "pdf", "mem", "crystallography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: Japanese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "gemmi>=0.7.5",
    "h5py>=3.16.0",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "spglib>=2.8.0",
]

[project.optional-dependencies]
gui = [
    "matplotlib>=3.11.2",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.12.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pyinstaller>=6.11",
]
dev = [
    "hypothesis>=6.168.5",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.12.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.0",
]

# ---------------------------------------------------------------------------
# ツール設定
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff 0.17 は Markdown の Python コードブロックも整形する。docs のレビュー原文(引用)は触らない
extend-exclude = ["docs/**/*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "NPY",      # numpy
    "RUF",      # ruff 固有
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 日本語文中の全角記号を許す
    "E741", "E743",                # 結晶学では l (エル) を変数名・属性名に使う
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/kaisetsu/gui/*.py" = ["E501"]  # 日本語の UI 文字列が長くなる
"tests/gui/*.py" = ["E501"]
"src/kaisetsu/scattering/tables/*.py" = ["E501"]  # 自動生成テーブル

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src/kaisetsu"]
strict = true
warn_unreachable = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gemmi", "gemmi.*", "numba", "numba.*", "h5py", "h5py.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "validation: GSAS-II など外部ソフトの参照値と突き合わせる(参照 JSON が必要)",
    "slow: 時間のかかるテスト",
]

[tool.coverage.run]
source = ["src/kaisetsu"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[project.scripts]
kaisetsu = "kaisetsu.cli:main"
kaisetsu-gui = "kaisetsu.gui.app:main"

[project.urls]
Homepage = "https://github.com/kinjo-tohoku/kaisetsu"
Repository = "https://github.com/kinjo-tohoku/kaisetsu"
Issues = "https://github.com/kinjo-tohoku/kaisetsu/issues"
Download = "https://github.com/kinjo-tohoku/kaisetsu/releases"

[[tool.mypy.overrides]]
module = ["kaisetsu.gui", "kaisetsu.gui.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false
disable_error_code = ["misc", "attr-defined", "no-untyped-call", "no-any-return", "arg-type", "union-attr", "override", "assignment", "call-overload"]
