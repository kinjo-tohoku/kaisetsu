# タグ v* を push すると Windows のインストーラと zip を作って GitHub Release に載せる。
#   git tag v0.1.0 && git push origin v0.1.0
# ダウンロード URL(常に最新):
#   https://github.com/kinjo-tohoku/kaisetsu/releases/latest/download/kaisetsu-windows-setup.exe
# 順序: テスト(高速)→ ビルド(dev グループ無し)→ Release を draft で作る → asset を上げる → 公開。
# 公開してから asset を上げると、その間に更新確認をした利用者には 404 になる(外部レビュー 2026-10-17 #10)。
# actions はタグで固定している(SHA 固定はネットワークから SHA を確かめてから行う)。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows インストーラ
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: バージョンとタグの一致を確認
        shell: pwsh
        run: |
          uv sync --extra gui
          $version = (uv run python -c "import kaisetsu; print(kaisetsu.__version__)").Trim()
          $tag = "${{ github.ref_name }}"
          Write-Host "kaisetsu.__version__ = $version, tag = $tag"
          if ($tag.StartsWith("v") -and $tag -ne "v$version") {
            throw "タグ $tag と kaisetsu.__version__ ($version) が一致しません"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: pytest(高速。落ちたら Release を作らない)
        shell: pwsh
        env:
          QT_QPA_FONTDIR: C:\Windows\Fonts
        run: uv run pytest -q -m "not slow"

      - name: 依存のインストール(配布用: dev グループ無し)
        run: uv sync --no-default-groups --extra gui --group build

      - name: PyInstaller + Inno Setup(起動確認・ライセンス一覧の突き合わせを含む)
        shell: pwsh
        run: .\packaging\build_windows.ps1

      - name: wheel と sdist
        run: uv build

      - name: Release に載せる(draft で作ってから asset を上げ、最後に公開する)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # バージョン無しの名前も置いて、/releases/latest/download/ の URL を固定にする
          Copy-Item "dist\kaisetsu-$env:VERSION-windows-setup.exe" "dist\kaisetsu-windows-setup.exe"
          Copy-Item "dist\kaisetsu-$env:VERSION-windows.zip" "dist\kaisetsu-windows.zip"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title "kaisetsu $env:VERSION" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create に失敗しました" }
          }
          gh release upload $tag --clobber `
            "dist\kaisetsu-$env:VERSION-windows-setup.exe" `
            "dist\kaisetsu-windows-setup.exe" `
            "dist\kaisetsu-$env:VERSION-windows.zip" `
            "dist\kaisetsu-windows.zip" `
            (Get-ChildItem dist\*.whl, dist\*.tar.gz | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw "gh release upload に失敗しました" }
          # asset がそろってから公開する(アプリ内更新が digest と大きさを照合できる状態にする)
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw "gh release edit --draft=false に失敗しました" }

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: kaisetsu-windows
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/*.whl
